<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Race - BetaControllerPro</title>
    <style>
        /* --- STYLE CSS (TEMA NEON GRADASI) --- */
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .game-container {
            text-align: center;
            width: 85%;
            max-width: 700px;
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        h2 {
            margin-top: 0;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #38bdf8, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Lintasan Balap */
        .track {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            height: 70px;
            margin: 20px 0;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.7);
        }

        /* Garis Finish Batas Kanan */
        .track::after {
            content: '';
            position: absolute;
            right: 60px;
            top: 0;
            bottom: 0;
            width: 10px;
            background: repeating-linear-gradient(
                45deg,
                #fff,
                #fff 5px,
                #000 5px,
                #000 10px
            );
            opacity: 0.5;
        }

        /* Mobil */
        .car {
            position: absolute;
            left: 10px; /* Posisi Start Awal */
            top: 50%;
            transform: translateY(-50%);
            font-size: 28px;
            transition: left 0.15s ease-out;
            white-space: nowrap;
            font-weight: bold;
        }

        .car span {
            font-size: 12px;
            color: #94a3b8;
            margin-left: 5px;
            background: #334155;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Area Ketik Pasif/Aktif */
        .input-section {
            margin-top: 25px;
        }

        .text-to-type {
            font-size: 18px;
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .highlight {
            color: #4ade80;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
        }

        /* Tombol Kontrol Dinamis */
        #btn-control {
            padding: 14px 40px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 10px;
        }

        /* Mode Mulai (Cyan ke Hijau Neon Gradasi) */
        .btn-neon-start {
            background: linear-gradient(135deg, #06b6d4, #10b981);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }

        .btn-neon-start:hover {
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.7);
            transform: translateY(-2px);
        }

        /* Mode Ulang (Merah ke Oranye Neon Gradasi) */
        .btn-neon-reset {
            background: linear-gradient(135deg, #f43f5e, #f97316);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.4);
        }

        .btn-neon-reset:hover {
            box-shadow: 0 0 25px rgba(244, 63, 94, 0.7);
            transform: translateY(-2px);
        }

        /* Status Info */
        #status-info {
            margin-top: 15px;
            font-weight: bold;
            min-height: 24px;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h2>Typing Race Arena</h2>
        
        <!-- Lintasan Jalur Balap -->
        <div class="track">
            <div class="car" id="car-player">🚗 <span>Kamu</span></div>
        </div>
        <div class="track">
            <div class="car" id="car-bot">🏎️ <span>Bot</span></div>
        </div>

        <!-- Area Interaksi Mengetik -->
        <div class="input-section">
            <div class="text-to-type" id="text-display">Tekan tombol MULAI MATCH di bawah untuk bertanding!</div>
        </div>

        <!-- Tombol Utama Pengendali State Game -->
        <button id="btn-control" class="btn-neon-start">Mulai Match</button>
        
        <!-- Info Status Pemenang -->
        <div id="status-info"></div>
    </div>

    <!-- --- LOGIKA JAVASCRIPT --- -->
    <script>
        // Inisialisasi Elemen HTML
        const btnControl = document.getElementById('btn-control');
        const carPlayer = document.getElementById('car-player');
        const carBot = document.getElementById('car-bot');
        const textDisplay = document.getElementById('text-display');
        const statusInfo = document.getElementById('status-info');

        // Parameter & State Game
        let isGameRunning = false;
        let botInterval = null;
        let playerProgress = 0;
        let botProgress = 0;
        const finishLine = 85; // Batas kemajuan dalam persen (%) sebelum menyentuh finish

        // Kata target simulasi untuk diketik (Bisa kamu kembangkan nanti)
        const targetText = "kucing melompat tinggi di atas atap rumah yang bersih";

        // Fungsi Memulai Pertandingan
        function startMatch() {
            isGameRunning = true;
            playerProgress = 0;
            botProgress = 0;
            statusInfo.innerText = "Game dimulai! Ayo ketik kalimat di bawah!";
            
            // Perbarui teks instruksi mengetik
            textDisplay.innerHTML = `Target: "${targetText}"`;

            // Ubah tombol Menjadi Mode "ULANG MATCH"
            btnControl.innerText = "Ulang Match";
            btnControl.className = "btn-neon-reset";

            // Jalankan Pergerakan Kecerdasan Bot Otomatis
            botInterval = setInterval(() => {
                if (isGameRunning) {
                    // Bot maju secara acak antara 1% sampai 4% setiap rentang waktu
                    botProgress += Math.random() * 3 + 1;
                    
                    if (botProgress >= finishLine) {
                        botProgress = finishLine;
                        endGame('bot');
                    }
                    
                    // Render posisi visual mobil Bot
                    carBot.style.left = botProgress + "%";
                }
            }, 300); // Bergerak tiap 300ms
        }

        // Fungsi Mereset Game Kembali ke Kondisi Awal Standby
        function resetMatch() {
            isGameRunning = false;
            clearInterval(botInterval); // Matikan timer pergerakan bot
            
            // Kembalikan koordinat posisi visual semua mobil ke titik nol (0%)
            playerProgress = 0;
            botProgress = 0;
            carPlayer.style.left = "10px";
            carBot.style.left = "10px";

            // Kembalikan Tampilan Tombol Menjadi Mode "MULAI MATCH"
            btnControl.innerText = "Mulai Match";
            btnControl.className = "btn-neon-start";

            // Bersihkan teks status info
            textDisplay.innerText = "Tekan tombol MULAI MATCH di bawah untuk bertanding!";
            statusInfo.innerText = "";
        }

        // Fungsi Ketika Seseorang Menyentuh Garis Finish Lebih Dulu
        function endGame(winner) {
            isGameRunning = false;
            clearInterval(botInterval);

            if (winner === 'player') {
                statusInfo.innerHTML = "🎉 <span style='color: #4ade80;'>Selamat! Kamu menang melawan Bot!</span>";
            } else {
                statusInfo.innerHTML = "❌ <span style='color: #f43f5e;'>Yah, Bot memenangkan balapan kali ini!</span>";
            }
        }

        // Event Utama Pada Tombol Kontrol Tunggal
        btnControl.addEventListener('click', () => {
            if (!isGameRunning) {
                startMatch(); // Jika kondisi belum mulai, jalankan pertandingan
            } else {
                resetMatch(); // Jika kondisi sedang tanding, reset balik ke awal
            }
        });

        // Handler Event Ketikan Pemain (Hanya bekerja penuh saat isGameRunning aktif)
        window.addEventListener('keydown', (e) => {
            if (!isGameRunning) return; // Proteksi: Jika belum diklik mulai, ketikan dicuekin

            // Simulasi deteksi ketikan acak (Maju 3% setiap tombol keyboard ditekan)
            // Catatan: Logika ini bisa kamu ganti dengan pencocokan string input teks yang asli nanti!
            if (e.key.length === 1) { 
                playerProgress += 3;
                
                if (playerProgress >= finishLine) {
                    playerProgress = finishLine;
                    endGame('player');
                }
                
                carPlayer.style.left = playerProgress + "%";
            }
        });
    </script>
</body>
</html>
