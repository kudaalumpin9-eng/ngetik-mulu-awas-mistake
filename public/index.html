<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGETIK MULU AWAS MISTAKE</title>
    <link rel="stylesheet" href="style.css">
    <!-- Load library Socket.io otomatis dari server -->
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <h1>🏎️ NGETIK MULU AWAS MISTAKE</h1>

    <div class="game-container">
        <!-- Setup Menu Mabar -->
        <div class="setup-area">
            <input type="text" id="nameInput" placeholder="Masukkan Nickname Lo...">
            <input type="text" id="roomInput" placeholder="Kode Room (Kosongkan jika ingin buat baru)">
            <button id="createBtn">Buat Room</button>
            <button id="joinBtn">Join Mabar</button>
        </div>

        <!-- Teks Yang Harus Diketik -->
        <div class="typing-box" id="textChallenge">Loading teks balapan...</div>
        
        <!-- Input Ketikan -->
        <textarea id="typingArea" placeholder="Mulai mengetik di sini ketika room sudah siap..." disabled></textarea>

        <!-- Sirkuit Balapan Lintas Player -->
        <div id="sirkuit-balapan">
            <p style="color: #64748b; text-align: center;">Belum masuk room. Buat atau Join room dulu buat mabar!</p>
        </div>
    </div>

    <script>
        const socket = io();
        let currentRoomId = null;
        let myPlayerName = "";
        let targetText = "Kecepatan jemari menentukan siapa raja jalanan di sirkuit digital ini.";
        let lastEmitTime = 0;
        const EMIT_INTERVAL = 100; // Anti-lag pengiriman paket data

        // Tampilkan teks tantangan awal
        document.getElementById('textChallenge').innerText = targetText;

        const createBtn = document.getElementById('createBtn');
        const joinBtn = document.getElementById('joinBtn');
        const roomInput = document.getElementById('roomInput');
        const nameInput = document.getElementById('nameInput');
        const typingArea = document.getElementById('typingArea');
        const track = document.getElementById('sirkuit-balapan');

        // Event Buat Room
        createBtn.addEventListener('click', () => {
            myPlayerName = nameInput.value.trim() || "Driver_" + Math.floor(Math.random() * 1000);
            currentRoomId = roomInput.value.trim() || Math.random().toString(36).substring(2, 7).toUpperCase();
            socket.emit('create-room', currentRoomId, myPlayerName);
        });

        // Event Join Room
        joinBtn.addEventListener('click', () => {
            myPlayerName = nameInput.value.trim() || "Driver_" + Math.floor(Math.random() * 1000);
            currentRoomId = roomInput.value.trim().toUpperCase();
            if (!currentRoomId) return alert("Masukkan Kode Room target mabar lo!");
            socket.emit('join-room', currentRoomId, myPlayerName);
        });

        // Deteksi Ketikan Real-Time Player
        typingArea.addEventListener('input', () => {
            const typedText = typingArea.value;
            
            // Cek kecocokan teks awal
            if (targetText.startsWith(typedText)) {
                typingArea.style.borderColor = "#38bdf8"; // Biru jika benar
                
                // Hitung persentase progress ketikan
                const progress = Math.floor((typedText.length / targetText.length) * 100);
                
                // 1. Update instan mobil sendiri di layar lokal
                const myCar = document.getElementById(`car-${socket.id}`);
                if (myCar) myCar.style.left = `${progress}%`;

                // 2. Kirim update terjadwal (Throttled) ke server untuk disebarkan ke musuh
                const now = Date.now();
                if (now - lastEmitTime > EMIT_INTERVAL || progress === 100) {
                    socket.emit('update-progress', currentRoomId, progress);
                    lastEmitTime = now;
                }
            } else {
                typingArea.style.borderColor = "#ef4444"; // Merah jika TYPO/MISTAKE!
            }
        });

        // RESPONSE SELESAI CONFIG ROOM DARI SERVER
        socket.on('room-created', (room) => {
            alert(`Room siap! Bagikan KODE ROOM ini ke temen lo: ${room.id}`);
            currentRoomId = room.id;
            prepareRace(room.players);
        });

        socket.on('room-updated', (room) => {
            prepareRace(room.players);
        });

        socket.on('progress-updated', (data) => {
            const enemyCar = document.getElementById(`car-${data.playerId}`);
            if (enemyCar) enemyCar.style.left = `${data.progress}%`;
        });

        socket.on('player-finished', (data) => {
            alert(`🏁 BALAPAN SELESAI! ${data.name} Berhasil Finish Duluan!`);
            typingArea.disabled = true;
        });

        socket.on('player-left', (playerId) => {
            const targetCar = document.getElementById(`car-${playerId}`);
            if (targetCar) targetCar.parentElement.remove();
        });

        socket.on('error-msg', (msg) => alert(msg));

        // Fungsi Render Jalur Balapan Player
        function prepareRace(players) {
            track.innerHTML = "";
            typingArea.disabled = false; // Aktifkan input ketik jika room valid
            
            players.forEach(p => {
                track.innerHTML += `
                    <div class="lane">
                        <div class="player-name">${p.name} ${p.id === socket.id ? '(Lo)' : ''}</div>
                        <div id="car-${p.id}" class="car-player" style="left: ${p.progress}%;">🏎️</div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
