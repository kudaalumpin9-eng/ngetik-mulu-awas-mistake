<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGETIK MULU AWAS MISTAKE</title>
    <link rel="stylesheet" href="style.css">
    <!-- Server Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <h1>🏎️ NGETIK MULU AWAS MISTAKE 🏎️</h1>

    <div class="game-container">
        <!-- 🎯 KEMBALI KE LAYOUT ASLI LO (Persis image_3fa77d.png) -->
        <div class="setup-box" id="menuSetup" style="text-align: center; padding: 10px;">
            <h3 style="color: #38bdf8; margin-top: 0;">🏁 Masuk Sirkuit Balap 🏁</h3>
            
            <!-- Input Nickname -->
            <input type="text" id="nameInput" placeholder="Masukkan Nickname Lo..." value="dimas" style="width: 100%; box-sizing: border-box; text-align: center; margin-bottom: 15px;">
            
            <hr style="border: 0; border-top: 1px dashed #334155; margin-bottom: 15px;">

            <!-- Tombol Main Solo / Bot Lawan -->
            <button id="soloBtn" style="background-color: #4ade80; color: #0f172a; width: 100%; margin-bottom: 15px; padding: 12px; font-weight: bold;">Main Solo + Bot Lawan 🤖</button>
            
            <hr style="border: 0; border-top: 1px dashed #334155; margin-bottom: 15px;">

            <!-- Tombol Buat Kamar Mabar Baru -->
            <button id="createBtn" style="background-color: #38bdf8; color: #0f172a; width: 100%; margin-bottom: 15px; padding: 12px; font-weight: bold;">Buat Kamar Mabar Baru 🌐</button>
            
            <!-- Area Join Kamar (Input Kode + Tombol Sampingan) -->
            <div style="display: flex; gap: 10px; justify-content: center; align-items: center;">
                <input type="text" id="roomInput" placeholder="KODE KAMAR" style="text-transform: uppercase; text-align: center; max-width: 60%;">
                <button id="joinBtn" style="background-color: #475569; color: #fff; padding: 10px 20px;">Join Kamar</button>
            </div>
        </div>

        <!-- AREA GAMEPLAY (Akan muncul/aktif setelah mabar atau solo dimulai) -->
        <div id="gameplayArea" style="margin-top: 25px;">
            <!-- Teks Tantangan Balapan -->
            <div class="typing-box" id="textChallenge" style="background-color: #0f172a; border: 2px solid #334155; padding: 15px; border-radius: 8px; font-size: 18px; line-height: 1.6; text-align: center; margin-bottom: 15px;">
                Kecepatan jemari menentukan siapa raja jalanan di sirkuit digital ini.
            </div>
            
            <!-- Tempat Ngetik -->
            <textarea id="typingArea" placeholder="Mulai mengetik di sini ketika game sudah siap..." disabled style="width: 100%; height: 70px; background-color: #0f172a; border: 2px solid #334155; color: #fff; border-radius: 8px; padding: 10px; font-size: 16px; resize: none; box-sizing: border-box;"></textarea>
        </div>

        <!-- LINTASAN BALAPAN -->
        <div id="sirkuit-balapan" style="background-color: #0f172a; border: 2px dashed #334155; border-radius: 8px; padding: 15px; margin-top: 25px;">
            <p id="sirkuit-placeholder" style="color: #64748b; text-align: center; margin: 10px 0;">Belum masuk sirkuit balap.</p>
        </div>
    </div>

    <!-- LOGIKA SINKRONISASI GAME (SOLO + MULTIPLAYER PRO) -->
    <script>
        const socket = io();
        let currentRoomId = null;
        let myPlayerName = "";
        let targetText = "Kecepatan jemari menentukan siapa raja jalanan di sirkuit digital ini.";
        let isSoloMode = false;
        let botInterval = null;
        let lastEmitTime = 0;
        const EMIT_INTERVAL = 100;

        const soloBtn = document.getElementById('soloBtn');
        const createBtn = document.getElementById('createBtn');
        const joinBtn = document.getElementById('joinBtn');
        const roomInput = document.getElementById('roomInput');
        const nameInput = document.getElementById('nameInput');
        const typingArea = document.getElementById('typingArea');
        const track = document.getElementById('sirkuit-balapan');
        const textChallenge = document.getElementById('textChallenge');

        // ================= FUNGSI 1: MODE SOLO + BOT LAWAN =================
        soloBtn.addEventListener('click', () => {
            isSoloMode = true;
            myPlayerName = nameInput.value.trim() || "dimas";
            clearInterval(botInterval);

            // Setup UI Sirkuit Solo
            track.innerHTML = `
                <div class="lane" style="border-bottom: 1px dashed #334155; padding: 10px 0; position: relative;">
                    <div class="player-name" style="font-size: 12px; color: #94a3b8;">${myPlayerName} (Lo)</div>
                    <div id="car-local" class="car-player" style="left: 0%;">🏎️</div>
                </div>
                <div class="lane" style="padding: 10px 0; position: relative;">
                    <div class="player-name" style="font-size: 12px; color: #f43f5e;">Bot Lawan 🤖</div>
                    <div id="car-bot" class="car-player" style="left: 0%;">🏎️</div>
                </div>
            `;

            typingArea.disabled = false;
            typingArea.value = "";
            typingArea.focus();

            // Jalankan Bot Lawan secara otomatis biar ada tantangan solo
            let botProgress = 0;
            botInterval = setInterval(() => {
                botProgress += Math.floor(Math.random() * 3) + 1; // Kecepatan ketik bot acak
                if (botProgress > 100) botProgress = 100;
                
                const botCar = document.getElementById('car-bot');
                if (botCar) botCar.style.left = `${botProgress}%`;

                if (botProgress >= 100 && isSoloMode) {
                    clearInterval(botInterval);
                    alert("🤖 Bot Lawan Finish Duluan! Lo kalah cepat, Bos!");
                    typingArea.disabled = true;
                }
            }, 300);
        });

        // ================= FUNGSI 2: MULTIPLAYER (BUAT KAMAR) =================
        createBtn.addEventListener('click', () => {
            isSoloMode = false;
            clearInterval(botInterval);
            myPlayerName = nameInput.value.trim() || "dimas";
            currentRoomId = Math.random().toString(36).substring(2, 7).toUpperCase();
            
            socket.emit('create-room', currentRoomId, myPlayerName);
        });

        // ================= FUNGSI 3: MULTIPLAYER (JOIN KAMAR) =================
        joinBtn.addEventListener('click', () => {
            isSoloMode = false;
            clearInterval(botInterval);
            myPlayerName = nameInput.value.trim() || "dimas";
            currentRoomId = roomInput.value.trim().toUpperCase();
            
            if (!currentRoomId) return alert("Isi kode kamarnya dulu, Bos!");
            socket.emit('join-room', currentRoomId, myPlayerName);
        });

        // ================= FUNGSI 4: DETEKSI KETIKAN GAMEPLAY =================
        typingArea.addEventListener('input', () => {
            const typedText = typingArea.value;
            
            if (targetText.startsWith(typedText)) {
                typingArea.style.borderColor = "#38bdf8";
                const progress = Math.floor((typedText.length / targetText.length) * 100);
                
                // Update Mobil Sendiri (Solo / Multiplayer)
                const targetCarId = isSoloMode ? 'car-local' : `car-${socket.id}`;
                const myCar = document.getElementById(targetCarId);
                if (myCar) myCar.style.left = `${progress}%`;

                if (progress >= 100) {
                    if (isSoloMode) {
                        clearInterval(botInterval);
                        alert("🎉 Selamat, Bos! Lo menang lawan bot!");
                        typingArea.disabled = true;
                    } else {
                        socket.emit('update-progress', currentRoomId, progress);
                    }
                    return;
                }

                // Kirim koordinat ke server jika dalam mode mabar online
                if (!isSoloMode) {
                    const now = Date.now();
                    if (now - lastEmitTime > EMIT_INTERVAL) {
                        socket.emit('update-progress', currentRoomId, progress);
                        lastEmitTime = now;
                    }
                }
            } else {
                typingArea.style.borderColor = "#ef4444"; // Deteksi typo/mistake
            }
        });

        // ================= SOCKET LISTENERS RESMI SERVER =================
        socket.on('room-created', (room) => {
            alert(`Kamar Berhasil Dibuat! KODE KAMAR: ${room.id}`);
            if (roomInput) roomInput.value = room.id;
            currentRoomId = room.id;
            prepareRace(room.players);
        });

        socket.on('room-updated', (room) => {
            prepareRace(room.players);
        });

        socket.on('progress-updated', (data) => {
            const enemyCar = document.getElementById(`car-${data.playerId}`);
            if (enemyCar) enemyCar.style.left = `${data.progress}%`;
        });

        socket.on('player-finished', (data) => {
            alert(`🏁 BALAPAN MULTIPLAYER SELESAI!\n👑 Pembalap [${data.name}] Berhasil Juara 1!`);
            typingArea.disabled = true;
        });

        socket.on('player-left', (playerId) => {
            const targetCar = document.getElementById(`car-${playerId}`);
            if (targetCar) targetCar.parentElement.remove();
        });

        socket.on('error-msg', (msg) => alert(msg));

        function prepareRace(players) {
            track.innerHTML = "";
            typingArea.disabled = false;
            typingArea.value = "";
            typingArea.placeholder = "Kamar mabar siap! Ayo mulai mengetik...";
            
            players.forEach(p => {
                track.innerHTML += `
                    <div class="lane" style="border-bottom: 1px dashed #334155; padding: 10px 0; position: relative; margin-top: 10px;">
                        <div class="player-name" style="font-size: 12px; color: #94a3b8; font-weight: bold;">
                            ${p.name} ${p.id === socket.id ? '(Lo)' : ''}
                        </div>
                        <div id="car-${p.id}" class="car-player" style="left: ${p.progress}%; font-size: 28px; position: relative; transition: left 0.1s linear;">🏎️</div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
