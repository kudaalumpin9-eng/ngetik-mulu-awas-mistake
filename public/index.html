<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeRacing Premium - Dark Mode</title>
    <style>
        /* --- THEME & UTILITIES --- */
        :root {
            --bg-color: #0d1117;
            --container-bg: #161b22;
            --border-color: #30363d;
            --accent-color: #58a6ff;
            --accent-hover: #1f6feb;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --word-correct: #58a6ff;
            --word-wrong: #f85149;
            --word-current: #21262d;
            --developer-color: #da3633;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-container {
            width: 100%;
            max-width: 900px;
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        /* --- DEVELOPER PANEL (KIRI ATAS) --- */
        .dev-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: transparent;
            border: 1px solid var(--developer-color);
            color: var(--developer-color);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .dev-btn:hover {
            background: var(--developer-color);
            color: #fff;
            box-shadow: 0 0 10px rgba(218, 54, 51, 0.4);
        }

        .dev-badge {
            background: var(--developer-color);
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
            margin-left: 5px;
        }

        /* --- LINTASAN BALAP & SPECTATOR ZONE --- */
        .track-container {
            background: #090d13;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            position: relative;
        }

        .track-title {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .lane {
            height: 50px;
            border-bottom: 1px dashed #21262d;
            position: relative;
            display: flex;
            align-items: center;
        }

        .lane:last-child {
            border-bottom: none;
        }

        /* 3D Shadow Layers Car Effect */
        .car {
            font-size: 28px;
            position: absolute;
            left: 0;
            transition: left 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            user-select: none;
            filter: drop-shadow(2px 4px 2px rgba(0,0,0,0.7)) 
                    drop-shadow(4px 8px 4px rgba(0,0,0,0.4));
            transform: translateZ(0);
        }

        .player-info {
            position: absolute;
            font-size: 11px;
            color: var(--text-muted);
            top: 2px;
            white-space: nowrap;
        }

        /* Tempat Mobil Penonton */
        .spectator-zone {
            background: #05070a;
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            padding: 10px;
            margin-top: 15px;
            min-height: 60px;
        }

        .spectator-cars {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 5px;
        }

        .spectator-car-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* --- KONTENER SOAL (KATA PRESTIGE) --- */
        .word-box {
            background: #090d13;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            font-size: 18px;
            line-height: 1.6;
            letter-spacing: 0.5px;
            min-height: 100px;
            max-height: 140px;
            overflow-y: auto;
            margin-bottom: 20px;
            user-select: none;
            word-wrap: break-word;
        }

        /* Modern Highlight Design */
        .word {
            display: inline-block;
            margin-right: 8px;
            padding: 2px 4px;
            border-radius: 4px;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }

        .word.current {
            background: var(--word-current);
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 0 0 2px var(--accent-color);
        }

        .word.correct {
            color: var(--word-correct);
            text-shadow: 0 0 8px rgba(88, 166, 255, 0.3);
        }

        .word.wrong {
            color: var(--word-wrong);
            background: rgba(248, 81, 73, 0.1);
            text-decoration: line-through;
        }

        /* --- CONTROL & INPUT --- */
        .input-panel {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .typing-input {
            flex: 1;
            background: #090d13;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px 15px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .typing-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        .typing-input.input-error {
            border-color: var(--word-wrong) !important;
            box-shadow: 0 0 0 3px rgba(248, 81, 73, 0.15) !important;
        }

        .btn {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 0 25px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        /* --- ROOM & LEADBOARD SPLIT --- */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .panel-box {
            background: #090d13;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
        }

        .panel-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .lobby-list, .history-list {
            list-style: none;
            font-size: 13px;
        }

        .lobby-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #161b22;
        }

        .lobby-actions button {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            padding: 2px 6px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            margin-left: 4px;
        }

        .lobby-actions button:hover {
            border-color: var(--word-wrong);
            color: var(--word-wrong);
        }

        .lobby-actions .make-host-btn:hover {
            border-color: var(--word-correct);
            color: var(--word-correct);
        }

        /* --- HISTORI HASIL (PERSISTEN) --- */
        .history-item {
            padding: 6px 0;
            border-bottom: 1px solid #161b22;
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
        }
        .history-item span.rank-1 { color: #d4af37; font-weight: bold; }

        /* Meta status top */
        .header-meta {
            text-align: right;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 15px;
            margin-top: 10px;
        }

        .mode-badge {
            background: #21262d;
            padding: 3px 8px;
            border-radius: 12px;
            color: #fff;
            font-weight: bold;
            font-size: 11px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Tombol Developer sesuai Request -->
        <button class="dev-btn" onclick="triggerDeveloperAccess()">Developer</button>

        <div class="header-meta">
            Mode Game: <span id="gameModeBadge" class="mode-badge">Balapan Klasik</span>
            <button id="toggleModeBtn" class="btn" style="padding:2px 8px; font-size:11px; margin-left:10px;">Ganti Mode</button>
        </div>

        <!-- Lintasan Utama -->
        <div class="track-container">
            <div class="track-title">🏁 Lintasan Utama Balapan</div>
            <div id="lanesContainer">
                <!-- Dinamis diisi mobil player aktif -->
            </div>
        </div>

        <!-- Tempat Khusus Mobil Penonton -->
        <div class="spectator-zone">
            <div class="track-title">👀 Area Penonton (Spectators)</div>
            <div id="spectatorCars" class="spectator-cars">
                <!-- Mobil penonton berkumpul di sini -->
            </div>
        </div>

        <!-- Kontener Soal kata yang diperbagus style-nya -->
        <div class="word-box" id="wordBox"></div>

        <!-- Input Panel -->
        <div class="input-panel">
            <input type="text" id="typingInput" class="typing-input" placeholder="Ketik di sini ketika game dimulai..." disabled autocomplete="off">
            <button id="startBtn" class="btn">Mulai Balapan</button>
        </div>

        <!-- Grid Dashboard Bawah -->
        <div class="dashboard-grid">
            <!-- Room / Player List -->
            <div class="panel-box">
                <div class="panel-title">👥 Daftar Pemain di Room</div>
                <ul id="lobbyList" class="lobby-list"></ul>
            </div>

            <!-- Hasil Balapan (Persisten / Tidak Hilang) -->
            <div class="panel-box">
                <div class="panel-title">🏆 Hasil Balapan Sebelumnya</div>
                <ul id="historyList" class="history-list">
                    <li style="color:var(--text-muted); font-style:italic; text-align:center; padding-top:10px;">Belum ada record data.</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        // --- DATA STATE SYSTEM ---
        const PARAGRAPH_POOL = "teknologi kecerdasan buatan berkembang sangat pesat di era digitalisasi global saat ini pemrograman menggunakan bahasa python memudahkan pengembang dalam melakukan otomatisasi sistem manajemen data berbasis cloud computing memerlukan tingkat keamanan cyber yang sangat ketat untuk mencegah kebocoran informasi krusial antarmuka aplikasi yang modern harus mengutamakan kenyamanan pengguna serta performa responsif";
        
        let players = [
            { id: 1, name: "Alexander", car: "🏎️", progress: 0, isHost: true, isSpectator: false, isDev: false },
            { id: 2, name: "Budi_Gamer", car: "🚗", progress: 0, isHost: false, isSpectator: false, isDev: false },
            { id: 3, name: "Chandra_S", car: "🚒", progress: 0, isHost: false, isSpectator: true, isDev: false },
            { id: 4, name: "DimasReza_16", car: "⚡", progress: 0, isHost: false, isSpectator: false, isDev: false }
        ];

        let currentPlayerId = 1; // Akun Anda saat ini
        let gameMode = "balapan"; // opsi: "balapan" atau "waktu"
        let currentWords = [];
        let currentWordIndex = 0;
        let isGameRunning = false;
        let finalResultsRecord = []; // Penyimpan data persisten

        // --- DOM ELEMENTS ---
        const wordBox = document.getElementById('wordBox');
        const typingInput = document.getElementById('typingInput');
        const startBtn = document.getElementById('startBtn');
        const lanesContainer = document.getElementById('lanesContainer');
        const spectatorCars = document.getElementById('spectatorCars');
        const lobbyList = document.getElementById('lobbyList');
        const historyList = document.getElementById('historyList');
        const gameModeBadge = document.getElementById('gameModeBadge');
        const toggleModeBtn = document.getElementById('toggleModeBtn');

        // --- INITIALIZATION ---
        function init() {
            renderLobby();
            renderTracks();
            prepareWords();
            setupInputListener();
            
            startBtn.addEventListener('click', startGame);
            toggleModeBtn.addEventListener('click', () => {
                if(isGameRunning) return;
                gameMode = (gameMode === "balapan") ? "waktu" : "balapan";
                gameModeBadge.textContent = gameMode === "balapan" ? "Balapan Klasik" : "Mode Waktu (Bebas Salah)";
                prepareWords();
            });
        }

        // --- CORE FUNCTIONS ---
        function prepareWords() {
            const list = PARAGRAPH_POOL.split(" ");
            // Shuffle
            currentWords = list.sort(() => Math.random() - 0.5).slice(0, 25);
            currentWordIndex = 0;
            renderWords();
        }

        function renderWords() {
            wordBox.innerHTML = currentWords.map((word, index) => {
                let status = "";
                if (index < currentWordIndex) status = "correct"; // default fallback visual
                if (index === currentWordIndex) status = "current";
                return `<span class="word ${status}" id="word-${index}">${word}</span>`;
            }).join("");
        }

        function renderTracks() {
            lanesContainer.innerHTML = "";
            spectatorCars.innerHTML = "";

            players.forEach(p => {
                if (p.isSpectator) {
                    // Masuk Tempat Khusus Mobil Penonton
                    const specWrap = document.createElement('div');
                    specWrap.className = "spectator-car-wrap";
                    specWrap.innerHTML = `
                        <div class="car" style="position:static; font-size:24px;">${p.car}</div>
                        <div style="font-size:9px; color:var(--text-muted); text-align:center;">${p.name} ${p.isHost?'(H)':''}</div>
                    `;
                    spectatorCars.appendChild(specWrap);
                } else {
                    // Masuk Lintasan Balap Utama
                    const lane = document.createElement('div');
                    lane.className = "lane";
                    
                    const pInfo = document.createElement('div');
                    pInfo.className = "player-info";
                    pInfo.innerHTML = `${p.name} ${p.isHost ? '👑 (Host)' : ''} ${p.isDev ? '<span class="dev-badge">DEV</span>' : ''}`;
                    
                    const carEl = document.createElement('div');
                    carEl.className = "car";
                    carEl.id = `car-${p.id}`;
                    carEl.textContent = p.car;
                    carEl.style.left = `${p.progress}%`;

                    lane.appendChild(pInfo);
                    lane.appendChild(carEl);
                    lanesContainer.appendChild(lane);
                }
            });
        }

        function renderLobby() {
            lobbyList.innerHTML = "";
            const currentTurnPlayer = players.find(p => p.id === currentPlayerId);

            players.forEach(p => {
                const li = document.createElement('li');
                li.className = "lobby-item";
                
                let identityStr = `${p.name} ${p.isSpectator ? '👁️ [Penonton]' : '🏎️ [Pembalap]'}`;
                if(p.isHost) identityStr += ' 👑';
                if(p.isDev) identityStr += ' <span class="dev-badge">DEV</span>';

                li.innerHTML = `<span>${identityStr}</span>`;

                // Actions panel
                const actionDiv = document.createElement('div');
                actionDiv.className = "lobby-actions";

                // Tombol aksi muncul jika user adalah Host atau User adalah DEVELOPER khusus
                if ((currentTurnPlayer.isHost || currentTurnPlayer.isDev) && p.id !== currentTurnPlayer.id) {
                    if (!p.isHost) {
                        actionDiv.innerHTML += `<button class="make-host-btn" onclick="setHost(${p.id})">Jadikan Host</button>`;
                    }
                    actionDiv.innerHTML += `<button onclick="kickPlayer(${p.id})">Kick</button>`;
                }
                
                li.appendChild(actionDiv);
                lobbyList.appendChild(li);
            });
        }

        // --- TYPING CORE LOGIC (Balapan vs Waktu) ---
        function setupInputListener() {
            typingInput.addEventListener('input', (e) => {
                if (!isGameRunning) return;

                const inputVal = typingInput.value;
                const currentWord = currentWords[currentWordIndex];
                const activeWordSpan = document.getElementById(`word-${currentWordIndex}`);

                if (gameMode === "balapan") {
                    // Aturan Balapan: Tidak boleh ada salah ketik untuk lanjut
                    if (inputVal.endsWith(" ")) {
                        const cleanInput = inputVal.trim();
                        if (cleanInput === currentWord) {
                            // Benar
                            activeWordSpan.className = "word correct";
                            typingInput.classList.remove('input-error');
                            advanceWord();
                            typingInput.value = "";
                        } else {
                            // Salah pencet spasi tapi kata belum benar -> BLOKIR / JANGAN MAU MAJU
                            typingInput.classList.add('input-error');
                            // Hapus spasi ujung agar user dipaksa membetulkan kata tersebut
                            typingInput.value = inputVal.trim();
                        }
                    } else {
                        // Realtime checking sebelum tekan spasi
                        if (currentWord.indexOf(inputVal) !== 0) {
                            typingInput.classList.add('input-error');
                        } else {
                            typingInput.classList.remove('input-error');
                        }
                    }

                } else {
                    // Aturan Mode Waktu: Boleh salah ketik, pencet spasi otomatis skip/lanjut
                    if (inputVal.endsWith(" ")) {
                        const cleanInput = inputVal.trim();
                        if (cleanInput === currentWord) {
                            activeWordSpan.className = "word correct";
                        } else {
                            activeWordSpan.className = "word wrong"; // Terhitung salah ketik, tidak dapat poin wpm
                        }
                        advanceWord();
                        typingInput.value = "";
                        typingInput.classList.remove('input-error');
                    } else {
                        // Cek realtime tipis sekadar feedback visual info merah
                        if (currentWord.indexOf(inputVal) !== 0) {
                            typingInput.classList.add('input-error');
                        } else {
                            typingInput.classList.remove('input-error');
                        }
                    }
                }
            });
        }

        function advanceWord() {
            currentWordIndex++;
            
            // Gerakkan mobil real-time progress player aktif
            const progressPercent = (currentWordIndex / currentWords.length) * 100;
            const myCar = document.getElementById(`car-${currentPlayerId}`);
            if(myCar) {
                myCar.style.left = `${Math.min(progressPercent, 90)}%`;
            }

            // Simulasi pergerakan kompetitor bot seadanya biar seru
            players.forEach(p => {
                if(p.id !== currentPlayerId && !p.isSpectator) {
                    p.progress += Math.random() * 4; 
                    const botCar = document.getElementById(`car-${p.id}`);
                    if(botCar) botCar.style.left = `${Math.min(p.progress, 90)}%`;
                }
            });

            if (currentWordIndex >= currentWords.length) {
                endGame();
            } else {
                const nextWordSpan = document.getElementById(`word-${currentWordIndex}`);
                if(nextWordSpan) nextWordSpan.className = "word current";
            }
        }

        // --- GAME FLOW SYSTEM ---
        function startGame() {
            isGameRunning = true;
            startBtn.disabled = true;
            typingInput.disabled = false;
            typingInput.value = "";
            typingInput.focus();
            
            // Reset progress lintasan
            players.forEach(p => p.progress = 0);
            renderTracks();
            prepareWords();
        }

        function endGame() {
            isGameRunning = false;
            startBtn.disabled = false;
            typingInput.disabled = true;
            
            // Catat hasil balapan ke variabel persisten (Jangan dihilangkan!)
            saveMatchHistory();
            alert("Balapan selesai! Hasil terekam di papan skor.");
        }

        function saveMatchHistory() {
            // Urutkan performa berdasarkan progress / simulasi acak penentuan ranking juara
            const standining = [...players]
                .filter(p => !p.isSpectator)
                .sort((a,b) => b.progress - a.progress);

            // Bersihkan teks default pembuka pertama kali jika ada
            if(finalResultsRecord.length === 0) historyList.innerHTML = "";

            const matchId = finalResultsRecord.length + 1;
            const recordTitle = document.createElement('li');
            recordTitle.style = "font-weight:bold; color:var(--accent-color); margin-top:8px; font-size:12px;";
            recordTitle.textContent = `Match #${matchId} Result:`;
            historyList.appendChild(recordTitle);

            standining.slice(0, 3).forEach((p, idx) => {
                const li = document.createElement('li');
                li.className = "history-item";
                li.innerHTML = `
                    <span class="rank-${idx+1}">#${idx+1} ${p.name}</span>
                    <span>${Math.floor(60 + (Math.random() * 40))} WPM</span>
                `;
                historyList.appendChild(li);
            });

            // Simpan ke memori data array agar tidak hilang sepanjang session tab
            finalResultsRecord.push(standining);
        }

        // --- DEVELOPER BACKDOOR ACCESS SYSTEM ---
        function triggerDeveloperAccess() {
            const username = prompt("Masukkan Nama Bebas:");
            if(!username) return;
            
            const password = prompt("Masukkan Password Developer Creator:");
            if (password === "160899") {
                // Berhasil login Developer Akses Khusus
                let me = players.find(p => p.id === currentPlayerId);
                if (me) {
                    me.name = username + " [DEV]";
                    me.isDev = true;
                    alert("Akses Developer Terverifikasi! Anda sekarang memiliki otoritas tertinggi (Kick Host & Mengganti Host).");
                    renderLobby();
                    renderTracks();
                }
            } else {
                alert("Password developer keliru!");
            }
        }

        // --- HOST & ROOM CONTROL LOGIC ---
        function setHost(targetId) {
            players.forEach(p => p.isHost = false);
            const target = players.find(p => p.id === targetId);
            if(target) {
                target.isHost = true;
                alert(`${target.name} sekarang adalah Host Baru.`);
            }
            renderLobby();
            renderTracks();
        }

        function kickPlayer(targetId) {
            const target = players.find(p => p.id === targetId);
            if (!target) return;

            const confirmKick = confirm(`Apakah anda yakin ingin mengeluarkan ${target.name}?`);
            if (confirmKick) {
                // Jika yang dikick ternyata kebetulan adalah host, serahkan otomatis ke player berikutnya sebelum dihapus
                if (target.isHost) {
                    passHostToNext(targetId);
                }
                
                players = players.filter(p => p.id !== targetId);
                alert("Player berhasil di-kick dari room.");
                renderLobby();
                renderTracks();
            }
        }

        // Sistem Auto Handover Host jika Host keluar / dikeluarkan
        function passHostToNext(currentHostId) {
            const nextAvailable = players.find(p => p.id !== currentHostId);
            if (nextAvailable) {
                nextAvailable.isHost = true;
                alert(`Host lama keluar. Jabatan host otomatis diserahkan ke player berikutnya: ${nextAvailable.name}`);
            }
        }

        // Jalankan inisialisasi awal
        window.onload = init;
    </script>
</body>
</html>
