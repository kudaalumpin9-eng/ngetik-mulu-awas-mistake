<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Typing Race - Grand Championship V7</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        .status-dot {
            height: 10px;
            width: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        .online { background-color: #4ade80; } 
        .offline { background-color: #f87171; } 
        
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --correct-color: #4ade80;
            --wrong-color: #f87171;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: 3fr 1fr;
            }
        }

        .main-panel, .side-panel {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .title-area {
            text-align: center;
            margin-bottom: 20px;
            grid-column: 1 / -1;
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
            color: var(--accent-color);
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        .track-box {
            background-color: #0b0f19;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }

        .lane {
            position: relative;
            height: 50px;
            border-bottom: 1px dashed #334155;
            display: flex;
            align-items: center;
        }

        .lane:last-child {
            border-bottom: none;
        }

        .car-avatar {
            position: absolute;
            font-size: 24px;
            transition: left 0.2s linear;
            left: 0%;
            transform: translateX(0);
            z-index: 2;
        }

        .lane-info {
            position: absolute;
            left: 10px;
            font-size: 12px;
            color: var(--text-muted);
            z-index: 1;
        }

        /* PERBAIKAN UTAMA: Box Penampung Kata Mengikuti Kustomisasi Baris */
        .text-display {
            background-color: #0b0f19;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.4rem;
            line-height: 40px;
            margin-bottom: 20px;
            border: 1px solid #334155;
            position: relative;
            transition: max-height 0.25s ease-in-out; /* Animasi smooth saat ganti opsi baris */
        }

        .words-wrapper {
            position: relative;
            transition: transform 0.2s ease;
        }

        .word-line {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .word {
            color: #94a3b8;
            padding: 0 4px;
            border-radius: 4px;
            display: inline-block;
        }

        .word.correct {
            color: var(--correct-color);
        }

        .word.current {
            background-color: rgba(56, 189, 248, 0.2);
            color: var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
        }

        .word.current.error {
            background-color: rgba(248, 113, 113, 0.2);
            color: var(--wrong-color);
            border-bottom: 2px solid var(--wrong-color);
        }

        .word.error {
            color: var(--wrong-color);
            text-decoration: line-through;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input[type="text"] {
            flex: 1;
            background-color: #0b0f19;
            border: 2px solid #334155;
            padding: 12px 20px;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1.2rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        input.input-error {
            border-color: var(--wrong-color) !important;
            background-color: rgba(248, 113, 113, 0.05);
        }

        .btn {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background-color: #475569;
            color: var(--text-main);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            text-align: center;
        }

        .stat-card {
            background-color: #0b0f19;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .stat-val {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .stat-lbl {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-top: 5px;
        }

        .leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #334155;
        }

        .leaderboard-item:last-child {
            border-bottom: none;
        }

        .setup-panel {
            margin-bottom: 20px;
            background-color: #0b0f19;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .form-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        select, input[type="number"] {
            background-color: var(--card-bg);
            border: 1px solid #334155;
            padding: 8px 12px;
            border-radius: 6px;
            color: var(--text-main);
            outline: none;
        }

        .mode-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            background-color: #0b0f19;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #334155;
            font-weight: bold;
        }

        .tab.active {
            background-color: var(--accent-color);
            color: #0f172a;
            border-color: var(--accent-color);
        }

        .online-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .chat-box {
            margin-top: 20px;
            background-color: #0b0f19;
            border-radius: 8px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            height: 200px;
        }

        .chat-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            font-size: 0.9rem;
        }

        .chat-input-area {
            display: flex;
            border-top: 1px solid #334155;
        }

        .chat-input-area input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px;
            color: var(--text-main);
            outline: none;
        }

        .chat-input-area button {
            background-color: var(--accent-color);
            border: none;
            color: #0f172a;
            padding: 0 15px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="title-area">
            <h1>🏎️ Cyber Typing Race</h1>
            <p style="color: var(--text-muted); margin: 5px 0 0 0;">Grand Championship System V7</p>
        </div>

        <div class="main-panel">
            <div class="mode-tabs">
                <div class="tab active" id="tab-local" onclick="switchMode('local')">📴 Main Sendiri (Lokal)</div>
                <div class="tab" id="tab-online" onclick="switchMode('online')">🌐 Main Bareng (Online)</div>
            </div>

            <div class="track-box" id="race-track">
                </div>

            <div class="text-display" id="words-window-box">
                <div class="words-wrapper" id="words-wrapper"></div>
            </div>

            <div class="input-area">
                <input type="text" id="input-box" placeholder="Ketik kata yang aktif di sini lalu tekan Spasi..." autocomplete="off" disabled />
                <button class="btn" id="start-btn" onclick="triggerStartRace()">MULAI BALAPAN</button>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-val" id="stat-wpm">0</div>
                    <div class="stat-lbl">Kecepatan (WPM)</div>
                </div>
                <div class="stat-card">
                    <div class="stat-val" id="stat-acc">100%</div>
                    <div class="stat-lbl">Akurasi</div>
                </div>
                <div class="stat-card">
                    <div class="stat-val" id="stat-time">0s</div>
                    <div class="stat-lbl">Waktu Jalan</div>
                </div>
            </div>
        </div>

        <div class="side-panel">
            <div class="setup-panel">
                <h3 style="margin-top:0; color: var(--accent-color);">Konfigurasi</h3>
                
                <div class="form-group">
                    <label>Nama Pembalap:</label>
                    <input type="text" id="player-name-input" value="Racer_Pro" style="background:#1e293b; border:1px solid #334155; padding:6px; color:#fff; border-radius:4px;" onchange="saveProfileData()">
                </div>

                <div class="form-group">
                    <label>Emoji Mobil:</label>
                    <select id="player-emoji-select" onchange="saveProfileData()">
                        <option value="🏎️">🏎️ Formula 1</option>
                        <option value="🚗">🚗 Sedan Merah</option>
                        <option value="🚓">🚓 Mobil Polisi</option>
                        <option value="🚀">🚀 Roket Cyber</option>
                        <option value="🏍️">🏍️ Motor Balap</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Jumlah Kata:</label>
                    <input type="number" id="word-count-config" value="30" min="10" max="200">
                </div>

                <div class="form-group">
                    <label>Tampilan Baris:</label>
                    <select id="line-view-select" onchange="renderWords()">
                        <option value="1">1 Baris Kata</option>
                        <option value="2" selected>2 Baris Kata</option>
                        <option value="all">Tampilkan Semua Baris</option>
                    </select>
                </div>
            </div>

            <div id="online-setup-box" style="display: none; border: 1px solid #334155; padding: 15px; border-radius: 8px; background: #0b0f19; margin-bottom: 20px;">
                <h3 style="margin-top:0; color:var(--accent-color);">Kamar Online</h3>
                <div class="form-group">
                    <label>ID Kamar (Room ID):</label>
                    <input type="text" id="online-room-id" value="MabarSeru" style="background:#1e293b; border:1px solid #334155; padding:6px; color:#fff; border-radius:4px;">
                </div>
                <div class="online-controls">
                    <button class="btn btn-secondary" style="padding:8px; flex:1; font-size:0.85rem;" onclick="connectToOnlineRoom()">MASUK ROOM</button>
                    <button class="btn style-host" id="host-start-btn" style="padding:8px; flex:1; font-size:0.85rem; display:none; background:#e11d48;" onclick="hostBroadcastStart()">HOST START</button>
                </div>
                <div id="room-status-indicator" style="margin-top: 10px; font-size: 0.85rem; color: var(--text-muted);">Status: Standalone</div>
            </div>

            <h3 style="margin-top: 10px;">🏆 Peringkat</h3>
            <div style="background-color: #0b0f19; padding: 12px; border-radius: 8px; border: 1px solid #334155;">
                <ul class="leaderboard-list" id="leaderboard-ui">
                    <li style="color: var(--text-muted); font-size:0.9rem;">Belum ada data balapan...</li>
                </ul>
            </div>

            <div class="chat-box" id="online-chat-box" style="display: none;">
                <div class="chat-messages" id="chat-messages-container"></div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input-field" placeholder="Ketik pesan chat...">
                    <button onclick="sendChatMessageToServer()">KIRIM</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Kumpulan Bank Data Kata Acak Indonesia (100 Kata)
        const indonesianWordsBank = [
            "saya", "kamu", "mereka", "kita", "adalah", "bisa", "punya", "banyak", "waktu", "jalan",
            "makan", "minum", "tidur", "kerja", "belajar", "rumah", "buku", "komputer", "aplikasi", "sistem",
            "balapan", "kecepatan", "mobil", "lintasan", "juara", "menang", "hebat", "cepat", "fokus", "ketik",
            "keyboard", "jari", "layar", "internet", "online", "lokal", "kamar", "teman", "bersama", "tantangan",
            "hari", "malam", "pagi", "siang", "bulan", "tahun", "waktu", "dunia", "negara", "indonesia",
            "bahasa", "kata", "kalimat", "paragraf", "membaca", "menulis", "belajar", "ilmu", "teknologi", "masa",
            "depan", "sukses", "impian", "cita", "kerja", "keras", "semangat", "pantang", "menyerah", "pasti",
            "bisa", "mampu", "luar", "biasa", "juara", "satu", "utama", "terbaik", "cepat", "tepat",
            "akurat", "kesalahan", "perbaikan", "latihan", "setiap", "detik", "menit", "jam", "fokus", "tenang",
            "santai", "seru", "asik", "gembira", "bahagia", "bersama", "kawan", "sahabat", "keluarga", "indonesia"
        ];

        let wordsList = [];
        let wordLineMappings = []; 
        let currentWordIndex = 0;
        let currentActiveLineIndex = 0;
        let totalTypedCharacters = 0;
        let correctTypedCharacters = 0;

        let raceTimerInterval = null;
        let elapsedSeconds = 0;
        let isRaceActive = false;

        let isOnlineMode = false;
        let socket = null;
        let currentOnlineRoomId = "";
        let isHostUser = false;

        let playerData = {
            name: "Racer_Pro",
            carEmoji: "🏎️",
            currentWpm: 0,
            progressPercent: 0,
            isFinished: false
        };

        // Mengambil Profile yang tersimpan atau generate default
        window.addEventListener('load', () => {
            const savedName = localStorage.getItem('racer_name');
            const savedEmoji = localStorage.getItem('racer_emoji');
            if (savedName) document.getElementById('player-name-input').value = savedName;
            if (savedEmoji) document.getElementById('player-emoji-select').value = savedEmoji;
            
            saveProfileData();
            initLocalRaceEnvironment();
        });

        function saveProfileData() {
            playerData.name = document.getElementById('player-name-input').value.trim() || "Racer";
            playerData.carEmoji = document.getElementById('player-emoji-select').value;
            localStorage.setItem('racer_name', playerData.name);
            localStorage.setItem('racer_emoji', playerData.carEmoji);
            
            if (isOnlineMode && socket && currentOnlineRoomId) {
                socket.emit('updateProgress', {
                    roomId: currentOnlineRoomId,
                    progressPercent: playerData.progressPercent,
                    currentWpm: playerData.currentWpm
                });
            } else {
                updateVisualRaceTrackLocal();
            }
        }

        function switchMode(mode) {
            if (mode === 'online') {
                isOnlineMode = true;
                document.getElementById('tab-online').className = 'tab active';
                document.getElementById('tab-local').className = 'tab';
                document.getElementById('online-setup-box').style.display = 'block';
                document.getElementById('online-chat-box').style.display = 'flex';
                document.getElementById('start-btn').style.display = 'none';
                
                if (!socket) {
                    setupSocketIoConnections();
                }
            } else {
                isOnlineMode = false;
                document.getElementById('tab-local').className = 'tab active';
                document.getElementById('tab-online').className = 'tab';
                document.getElementById('online-setup-box').style.display = 'none';
                document.getElementById('online-chat-box').style.display = 'none';
                document.getElementById('start-btn').style.display = 'block';
                document.getElementById('host-start-btn').style.display = 'none';
                
                document.getElementById('room-status-indicator').innerText = "Status: Standalone";
                initLocalRaceEnvironment();
            }
        }

        function generateRandomWordsList(count) {
            let temp = [];
            for (let i = 0; i < count; i++) {
                const idx = Math.floor(Math.random() * indonesianWordsBank.length);
                temp.push(indonesianWordsBank[idx]);
            }
            return temp;
        }

        function initLocalRaceEnvironment() {
            stopRaceTimerEngine();
            const count = parseInt(document.getElementById('word-count-config').value) || 30;
            wordsList = generateRandomWordsList(count);
            
            currentWordIndex = 0;
            totalTypedCharacters = 0;
            correctTypedCharacters = 0;
            elapsedSeconds = 0;
            isRaceActive = false;
            playerData.isFinished = false;
            playerData.progressPercent = 0;
            playerData.currentWpm = 0;

            document.getElementById('stat-wpm').innerText = "0";
            document.getElementById('stat-acc').innerText = "100%";
            document.getElementById('stat-time').innerText = "0s";
            document.getElementById('input-box').value = "";
            document.getElementById('input-box').disabled = true;
            document.getElementById('input-box').className = "";

            renderWords();
            updateVisualRaceTrackLocal();
            
            document.getElementById('leaderboard-ui').innerHTML = `<li style="color: var(--text-muted); font-size:0.9rem;">Menunggu balapan dimulai...</li>`;
        }

        // PERBAIKAN FUNGSIONAL: Menyesuaikan tinggi kontener box secara presisi berdasarkan custom baris
        function renderWords() {
            const wrapper = document.getElementById('words-wrapper');
            wrapper.innerHTML = "";
            wordLineMappings = [];
            
            const lineConfig = document.getElementById('line-view-select').value;
            const windowBox = document.getElementById('words-window-box');
            
            // Menyesuaikan max-height box kata secara presisi agar tidak terpotong setengah baris
            if (lineConfig === "1") {
                windowBox.style.maxHeight = "45px";   // Cukup untuk 1 baris kata
                windowBox.style.overflow = "hidden";
            } else if (lineConfig === "2") {
                windowBox.style.maxHeight = "85px";   // Cukup untuk 2 baris kata pas
                windowBox.style.overflow = "hidden";
            } else {
                windowBox.style.maxHeight = "none";   // Jika 'all', hilangkan batas tinggi agar semua terlihat
                windowBox.style.overflow = "visible";
            }

            // Membuat line tunggal penampung semua kata agar browser mendistribusikan kata secara dinamis
            let currentLineDiv = document.createElement('div');
            currentLineDiv.className = "word-line";
            
            // Masukkan semua kata ke dalam container utama terlebih dahulu
            wordsList.forEach((word, idx) => {
                const span = document.createElement('span');
                span.id = `word-${idx}`;
                span.className = idx === 0 ? 'word current' : 'word';
                span.innerText = word;
                currentLineDiv.appendChild(span);
            });
            wrapper.appendChild(currentLineDiv);

            // MENGHITUNG DISTRIBUSI BARIS SECARA REAL-TIME BERDASARKAN ELEMEN YANG JATUH KE BAWAH (AUTO-WRAP)
            setTimeout(() => {
                let linesTemp = [];
                let currentLineIndices = [];
                let lastTopOffset = -1;

                wordsList.forEach((_, idx) => {
                    const span = document.getElementById(`word-${idx}`);
                    if (!span) return;
                    
                    let currentTopOffset = span.offsetTop;

                    // Deteksi pergantian baris baru berdasarkan koordinat posisi top vertikal huruf
                    if (lastTopOffset !== -1 && currentTopOffset > lastTopOffset) {
                        linesTemp.push(currentLineIndices);
                        currentLineIndices = [];
                    }
                    currentLineIndices.push(idx);
                    lastTopOffset = currentTopOffset;
                });
                if (currentLineIndices.length > 0) {
                    linesTemp.push(currentLineIndices);
                }
                wordLineMappings = linesTemp;
            }, 50);

            currentActiveLineIndex = 0;
            wrapper.style.transform = "translateY(0px)";
        }

        function updateVisualRaceTrackLocal() {
            const track = document.getElementById('race-track');
            track.innerHTML = `
                <div class="lane">
                    <span class="lane-info">${playerData.name} (Anda)</span>
                    <div class="car-avatar" id="car-local-player" style="left: ${playerData.progressPercent}%;">${playerData.carEmoji}</div>
                </div>
            `;
        }

        function triggerStartRace() {
            initLocalRaceEnvironment();
            executeCountdownSequence(() => {
                isRaceActive = true;
                document.getElementById('input-box').disabled = false;
                document.getElementById('input-box').focus();
                startRaceTimerEngine();
            });
        }

        function executeCountdownSequence(callback) {
            let count = 3;
            document.getElementById('input-box').placeholder = `Bersiap... ${count}`;
            let timer = setInterval(() => {
                count--;
                if (count <= 0) {
                    clearInterval(timer);
                    document.getElementById('input-box').placeholder = "AYO KETIK SEKARANG!";
                    callback();
                } else {
                    document.getElementById('input-box').placeholder = `Bersiap... ${count}`;
                }
            }, 1000);
        }

        function startRaceTimerEngine() {
            elapsedSeconds = 0;
            raceTimerInterval = setInterval(() => {
                elapsedSeconds++;
                document.getElementById('stat-time').innerText = `${elapsedSeconds}s`;
                calculateLiveTypingStats();

                if (isOnlineMode && !playerData.isFinished) {
                    socket.emit('updateProgress', {
                        roomId: currentOnlineRoomId,
                        progressPercent: playerData.progressPercent,
                        currentWpm: playerData.currentWpm
                    });
                }
            }, 1000);
        }

        function stopRaceTimerEngine() {
            if (raceTimerInterval) {
                clearInterval(raceTimerInterval);
                raceTimerInterval = null;
            }
        }

        function calculateLiveTypingStats() {
            if (elapsedSeconds <= 0) return;
            // Rumus WPM Standar Dunia: (Jumlah Karakter Benar / 5) / Menit Waktu Jalan
            const wpm = Math.round((correctTypedCharacters / 5) / (elapsedSeconds / 60));
            playerData.currentWpm = wpm;
            document.getElementById('stat-wpm').innerText = wpm;

            const accuracy = totalTypedCharacters > 0 ? Math.round((correctTypedCharacters / totalTypedCharacters) * 100) : 100;
            document.getElementById('stat-acc').innerText = `${accuracy}%`;
        }

        function registerRacerFinishedLocal(name, finalWpm, emoji) {
            stopRaceTimerEngine();
            isRaceActive = false;
            document.getElementById('input-box').disabled = true;
            document.getElementById('input-box').placeholder = "Balapan Selesai!";
            
            const leaderboardUi = document.getElementById('leaderboard-ui');
            leaderboardUi.innerHTML = `
                <li class="leaderboard-item" style="color: var(--correct-color); font-weight: bold;">
                    <span>🥇 1. ${emoji} ${name}</span>
                    <span>${finalWpm} WPM (FINISH)</span>
                </li>
            `;
        }

        // ==========================================
        // SISTEM HUBUNGAN ENGINE ONLINE (SOCKET.IO)
        // ==========================================
        function setupSocketIoConnections() {
            socket = io();

            socket.on('roomData', (room) => {
                const track = document.getElementById('race-track');
                track.innerHTML = "";
                
                // Sinkronisasi data identitas host kamar
                if (room.hostId === socket.id) {
                    isHostUser = true;
                    document.getElementById('host-start-btn').style.display = 'block';
                } else {
                    isHostUser = false;
                    document.getElementById('host-start-btn').style.display = 'none';
                }

                // Gambar ulang lintasan seluruh pemain mabar secara real-time
                Object.keys(room.players).forEach((pId) => {
                    const player = room.players[pId];
                    const isMe = pId === socket.id;
                    
                    const lane = document.createElement('div');
                    lane.className = "lane";
                    lane.innerHTML = `
                        <span class="lane-info">${player.name} ${isMe ? '(Anda)' : ''} ${player.isOnline === 'offline' ? '🔴' : ''}</span>
                        <div class="car-avatar" style="left: ${player.progressPercent}%;">${player.carEmoji}</div>
                    `;
                    track.appendChild(lane);
                });
            });

            socket.on('forceTriggerStart', (generatedWords) => {
                wordsList = generatedWords;
                currentWordIndex = 0;
                totalTypedCharacters = 0;
                correctTypedCharacters = 0;
                elapsedSeconds = 0;
                playerData.isFinished = false;
                playerData.progressPercent = 0;
                playerData.currentWpm = 0;

                document.getElementById('stat-wpm').innerText = "0";
                document.getElementById('stat-acc').innerText = "100%";
                document.getElementById('stat-time').innerText = "0s";
                document.getElementById('input-box').value = "";
                document.getElementById('input-box').disabled = true;

                renderWords();
                
                executeCountdownSequence(() => {
                    isRaceActive = true;
                    document.getElementById('input-box').disabled = false;
                    document.getElementById('input-box').focus();
                    startRaceTimerEngine();
                });
            });

            socket.on('receiveFinalData', (results) => {
                const leaderboardUi = document.getElementById('leaderboard-ui');
                leaderboardUi.innerHTML = "";
                results.forEach((res, index) => {
                    const medal = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : "🏁";
                    const li = document.createElement('li');
                    li.className = "leaderboard-item";
                    li.innerHTML = `
                        <span>${medal} ${index + 1}. ${res.emoji} ${res.name}</span>
                        <span>${res.wpm} WPM</span>
                    `;
                    leaderboardUi.appendChild(li);
                });
            });

            socket.on('incomingChatMessage', ({ sender, text }) => {
                const chatContainer = document.getElementById('chat-messages-container');
                const msgElement = document.createElement('div');
                msgElement.innerHTML = `<strong>${sender}:</strong> ${text}`;
                chatContainer.appendChild(msgElement);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            });

            socket.on('performReset', () => {
                stopRaceTimerEngine();
                isRaceActive = false;
                document.getElementById('input-box').value = "";
                document.getElementById('input-box').disabled = true;
                document.getElementById('stat-wpm').innerText = "0";
                document.getElementById('stat-time').innerText = "0s";
            });
        }

        function connectToOnlineRoom() {
            const roomId = document.getElementById('online-room-id').value.trim();
            if (!roomId) return alert("Room ID tidak boleh kosong!");
            
            currentOnlineRoomId = roomId;
            document.getElementById('room-status-indicator').innerText = `Kamar: ${roomId}`;
            
            socket.emit('joinRaceRoom', {
                roomId: roomId,
                name: playerData.name,
                carEmoji: playerData.carEmoji
            });
        }

        function hostBroadcastStart() {
            const count = parseInt(document.getElementById('word-count-config').value) || 30;
            const words = generateRandomWordsList(count);
            socket.emit('hostRequestStart', { roomId: currentOnlineRoomId, words: words });
        }

        function sendChatMessageToServer() {
            const input = document.getElementById('chat-input-field');
            const txt = input.value.trim();
            if (!txt) return;
            
            socket.emit('sendChatMessage', {
                roomId: currentOnlineRoomId,
                sender: playerData.name,
                text: txt,
                senderId: socket.id
            });
            input.value = "";
        }

        // ==========================================
        // ALGORITMA UTAMA ENGINE CEK RECOGNITION TYPING
        // ==========================================
        document.getElementById('input-box').addEventListener('input', (e) => {
            if (!isRaceActive) return;

            const inputField = e.target;
            let typedValue = inputField.value;
            const currentTargetWord = wordsList[currentWordIndex];

            const currentWordSpan = document.getElementById(`word-${currentWordIndex}`);

            // DETEKSI AKSI SPASI (Artinya Pemain Melakukan Submit Kata)
            if (typedValue.endsWith(" ")) {
                const finalCleanWord = typedValue.trim();
                
                if (finalCleanWord === currentTargetWord) {
                    currentWordSpan.className = 'word correct';
                    correctTypedCharacters += currentTargetWord.length + 1; // Ditambah 1 Karakter Spasi
                } else {
                    currentWordSpan.className = 'word error';
                }
                
                totalTypedCharacters += currentTargetWord.length + 1;
                currentWordIndex++;
                inputField.value = "";
                inputField.className = "";

                // PERBAIKAN: Efek Geser/Sliding Layar Naik Atas Mengikuti Aturan Baris Kustom
                const currentLineRange = wordLineMappings[currentActiveLineIndex];
                if (currentLineRange && currentWordIndex > currentLineRange[currentLineRange.length - 1]) {
                    currentActiveLineIndex++;
                    const lineConfig = document.getElementById('line-view-select').value;
                    
                    // Hanya lakukan sliding effect jika user mengunci tampilan ke 1 atau 2 baris saja
                    if (lineConfig === "1") {
                        const offsetHeight = currentActiveLineIndex * 40; // Naik per 1 baris
                        document.getElementById('words-wrapper').style.transform = `translateY(-${offsetHeight}px)`;
                    } else if (lineConfig === "2") {
                        // Melakukan scroll up hanya setiap kelipatan baris genap agar space tetap efisien
                        const offsetHeight = Math.floor(currentActiveLineIndex / 1) * 40; 
                        document.getElementById('words-wrapper').style.transform = `translateY(-${offsetHeight}px)`;
                    } else {
                        // Jika pilih 'all', text container tidak perlu digeser naik sama sekali
                        document.getElementById('words-wrapper').style.transform = "translateY(0px)";
                    }
                }

                // HITUNG PERSENTASE MOBIL DI LINTASAN
                playerData.progressPercent = Math.round((currentWordIndex / wordsList.length) * 100);
                
                if (isOnlineMode) {
                    socket.emit('updateProgress', {
                        roomId: currentOnlineRoomId,
                        progressPercent: playerData.progressPercent,
                        currentWpm: playerData.currentWpm
                    });
                } else {
                    updateVisualRaceTrackLocal();
                }

                // APAKAH RACER SUDAH MENCAPAI KATA TERAKHIR (FINISH)?
                if (currentWordIndex >= wordsList.length) {
                    playerData.isFinished = true;
                    calculateLiveTypingStats();
                    
                    if (isOnlineMode) {
                        socket.emit('submitFinalData', { 
                            roomId: currentOnlineRoomId, 
                            name: playerData.name, 
                            wpm: playerData.currentWpm, 
                            isPlayer: true, 
                            emoji: playerData.carEmoji 
                        });
                    } else {
                        registerRacerFinishedLocal(playerData.name, playerData.currentWpm, playerData.carEmoji);
                    }
                } else {
                    if(document.getElementById(`word-${currentWordIndex}`)) {
                        document.getElementById(`word-${currentWordIndex}`).className = 'word current';
                    }
                }
            } else {
                // REAL-TIME CEK HURUF PER HURUF SAAT SEDANG MENGETIK KATA BERJALAN
                if (currentTargetWord.startsWith(typedValue)) {
                    currentWordSpan.className = 'word current';
                    inputField.className = "";
                } else {
                    currentWordSpan.className = 'word current error';
                    inputField.className = "input-error";
                }
            }
        });

        document.addEventListener("visibilitychange", () => {
            if (!isOnlineMode) return;
            const status = document.hidden ? 'offline' : 'online';
            socket.emit('updateStatus', { roomId: currentOnlineRoomId, status: status });
        });
    </script>
</body>
</html>
