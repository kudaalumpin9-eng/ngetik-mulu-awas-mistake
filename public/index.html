<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Typing Race - Grand Championship V10</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        /* MENGEKALKAN CIRI ASAL STATUS DOT ANDA */
        .status-dot {
            height: 10px;
            width: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            vertical-align: middle;
        }
        .online { background-color: #4ade80; box-shadow: 0 0 8px #4ade80; } 
        .offline { background-color: #f87171; box-shadow: 0 0 8px #f87171; } 
        
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --correct-color: #4ade80;
            --wrong-color: #f87171;
            --chat-self: #0284c7;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lobby-panel, .track-container, .text-display, .tournament-results {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 850px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .lobby-panel { max-width: 500px; text-align: center; }

        /* GARASI KENDERAAN (DITAMBAH SKATEBOARD & SEPATU RODA) */
        .garage-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin: 15px 0;
        }

        .garage-item {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            text-align: center;
        }

        .garage-item.selected-car {
            border-color: var(--accent-color);
            background: rgba(56, 189, 248, 0.1);
        }

        .track-lane {
            height: 70px;
            border-bottom: 2px dashed #334155;
            position: relative;
            display: flex;
            align-items: center;
        }

        .car-node-wrapper {
            position: absolute;
            left: 0;
            transition: left 0.2s linear;
            font-size: 30px;
        }

        .word { display: inline-block; margin-right: 8px; font-size: 1.25rem; color: var(--text-muted); }
        .word.current { color: var(--text-main); background: rgba(56, 189, 248, 0.2); border-radius: 4px; padding: 0 4px; }
        .word.current.error { background: rgba(248, 113, 113, 0.3); }
        .word.completed { color: var(--correct-color); }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-success { background-color: #22c55e; color: white; }
        .btn-primary { background-color: #3b82f6; color: white; }
        .btn-danger { background-color: #ef4444; color: white; }
        .btn-secondary { background-color: #64748b; color: white; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body>

    <div class="lobby-panel" id="lobby-panel">
        <h2>🏁 Main Balapan</h2>
        <input type="text" id="nickname-input" placeholder="Masukkan Nickname..." value="Racer" style="padding: 10px; width: 80%; margin-bottom: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff;">
        <br>
        <button class="btn btn-primary" onclick="createNewOnlineRoom()">Buat Kamar Baru 🌐</button>
        <input type="text" id="roomcode-input" placeholder="KODE ROOM" style="padding: 10px; width: 100px; text-transform: uppercase; border-radius: 6px; margin-left: 10px;">
        <button class="btn btn-secondary" onclick="joinOnlineRoom()">Join</button>
    </div>

    <div class="modal-overlay" id="sharelink-join-modal">
        <div class="tournament-results" style="max-width: 450px; text-align: center;">
            <h3>Undangan Kamar Balap 🏎️</h3>
            <input type="text" id="sharelink-nickname-input" placeholder="Nama Anda..." value="Racer" style="padding: 10px; width: 80%; margin-bottom: 15px;">
            
            <p>Pilih Kendaraan Anda:</p>
            <div class="garage-grid">
                <div class="garage-item selected-car" id="car-1" onclick="selectVehicle('🚗', 'car-1')">🚗 Sedan</div>
                <div class="garage-item" id="car-2" onclick="selectVehicle('🏎️', 'car-2')">🏎️ F1 Car</div>
                <div class="garage-item" id="car-3" onclick="selectVehicle('🛹', 'car-3')">🛹 Skateboard</div>
                <div class="garage-item" id="car-4" onclick="selectVehicle('🛼', 'car-4')">🛼 Sepatu Roda</div>
            </div>
            <button class="btn btn-success" onclick="confirmJoinViaShareLink()">Masuk Arena 🏁</button>
        </div>
    </div>

    <div id="main-arena" style="display: none; width: 100%; max-width: 850px;">
        <div class="track-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <div>Kamar ID: <span id="room-code-txt" style="font-weight: bold; color: var(--accent-color);">-</span></div>
                
                <div style="display: flex; gap: 10px; align-items: center;">
                    <label style="background: #334155; padding: 6px 12px; border-radius: 6px; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 5px;">
                        <input type="checkbox" id="spectator-toggle" onchange="toggleSpectatorMode(this.checked)"> 👁️ Menonton
                    </label>
                    <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.85rem;" onclick="copyRoomShareLink()">Salin Link 🔗</button>
                    <button class="btn btn-danger" style="padding: 6px 12px; font-size: 0.85rem;" onclick="leaveRoomAction()">Keluar 🏃</button>
                </div>
            </div>
            
            <div id="live-timer-banner" style="display:none; text-align: center; font-weight: bold; color: var(--wrong-color); margin-bottom: 10px;">BALAPAN BERJALAN!</div>
            <div id="lanes-container"></div>
        </div>

        <div class="text-display" id="words-wrapper"></div>
        
        <div style="display: flex; gap: 10px;">
            <input type="text" id="input-box" placeholder="Menunggu Balapan..." disabled style="flex: 1; padding: 15px; font-size: 1.1rem; border-radius: 8px; background: #0f172a; color: #fff; border: 1px solid #334155;" oninput="handleTypingInput()">
            <button id="ready-btn" class="btn btn-success" onclick="toggleReady()">READY 🏁</button>
            <button id="view-scores-btn" class="btn btn-primary" style="display: none;" onclick="openScoresModal()">Lihat Skor 🏆</button>
        </div>
    </div>

    <div class="modal-overlay" id="results-modal">
        <div class="tournament-results" style="max-width: 500px;">
            <h3 style="text-align: center; color: var(--correct-color);">Papan Skor Balapan Final 🏁</h3>
            <div id="leaderboard-list" style="margin: 20px 0;"></div>
            <div style="text-align: center; display: flex; gap: 10px; justify-content: center;">
                <button class="btn btn-primary" id="host-reset-btn" style="display: none;" onclick="requestResetMatch()">Reset Balapan (Host) 🔄</button>
                <button class="btn btn-secondary" onclick="closeModalOnly()">Tutup</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentOnlineRoomId = null;
        let myName = "";
        let mySelectedEmoji = "🚗";
        let wordsList = ["balapan", "cyber", "keyboard", "kecepatan", "komputer", "sirkuit", "skateboard", "sepatu", "roda"];
        let currentWordIndex = 0;
        let isGameActive = false;
        let amIReady = false;
        let amISpectator = false;
        let urlRoomCode = null;

        function selectVehicle(emoji, id) {
            document.querySelectorAll('.garage-item').forEach(el => el.classList.remove('selected-car'));
            document.getElementById(id).classList.add('selected-car');
            mySelectedEmoji = emoji;
        }

        function createNewOnlineRoom() {
            myName = document.getElementById('nickname-input').value.trim() || "Racer";
            socket.emit('createRoom', { playerName: myName });
        }

        function joinOnlineRoom() {
            const code = document.getElementById('roomcode-input').value.trim().toUpperCase();
            if(!code) return alert("Sila isi kode room!");
            myName = document.getElementById('nickname-input').value.trim() || "Racer";
            socket.emit('joinRoom', { roomId: code, playerName: myName });
        }

        function confirmJoinViaShareLink() {
            myName = document.getElementById('sharelink-nickname-input').value.trim() || "Racer";
            socket.emit('joinRoom', { roomId: urlRoomCode, playerName: myName });
            document.getElementById('sharelink-join-modal').classList.remove('active');
        }

        socket.on('joinSuccess', ({ roomId, isHost }) => {
            currentOnlineRoomId = roomId;
            document.getElementById('lobby-panel').style.display = 'none';
            document.getElementById('main-arena').style.display = 'block';
            document.getElementById('room-code-txt').innerText = roomId;
            if(isHost) document.getElementById('host-reset-btn').style.display = 'inline-block';
            
            socket.emit('updateStatus', { roomId: roomId, status: true });
            socket.emit('updateProgress', { roomId: currentOnlineRoomId, progressPercent: 0, currentWpm: 0, emoji: mySelectedEmoji });
        });

        socket.on('errorMsg', (msg) => alert(msg));

        // KAWALAN REAL-TIME ARENA TRACK
        socket.on('roomData', (room) => {
            const container = document.getElementById('lanes-container');
            container.innerHTML = '';

            Object.keys(room.players).forEach((pId) => {
                const p = room.players[pId];
                
                // JIKA PEMAIN ADALAH SPECTATOR (MENONTON), JANGAN MASUKKAN KENDERAAN KE ARENA LINTASAN
                if(p.isSpectator) return;

                const statusClass = p.isOnline ? 'online' : 'offline';
                const readyText = p.isReady ? '✅ READY' : '⏳ WAIT';

                const lane = document.createElement('div');
                lane.className = "track-lane";
                lane.innerHTML = `
                    <div style="position: absolute; top: 5px; left: 5px; font-size: 0.8rem; color: var(--text-muted);">
                        <span class="status-dot ${statusClass}"></span>
                        <strong>${p.name}</strong> (${readyText}) - <span style="color:var(--accent-color);">${p.currentWpm || 0} WPM</span>
                    </div>
                    <div class="car-node-wrapper" style="left: ${p.progressPercent || 0}%;">
                        ${p.carEmoji || '🚗'}
                    </div>
                `;
                container.appendChild(lane);
            });
        });

        function toggleReady() {
            if(amISpectator) return;
            amIReady = !amIReady;
            socket.emit('toggleReady', { roomId: currentOnlineRoomId, isReady: amIReady });
            document.getElementById('ready-btn').innerText = amIReady ? "READY ✔️" : "READY 🏁";
        }

        // FUNGSI TOGGLE MODE MENONTON
        function toggleSpectatorMode(isSpectator) {
            amISpectator = isSpectator;
            const inp = document.getElementById('input-box');
            
            if(isSpectator) {
                inp.disabled = true;
                inp.placeholder = "Mode Menonton Aktif 👁️";
                document.getElementById('ready-btn').style.display = 'none';
                if(amIReady) toggleReady(); // matikan ready jika ada
            } else {
                inp.placeholder = "Menunggu Balapan...";
                document.getElementById('ready-btn').style.display = 'inline-block';
            }
            socket.emit('toggleSpectator', { roomId: currentOnlineRoomId, isSpectator: isSpectator });
        }

        socket.on('startCountdown', () => {
            let count = 3;
            const inp = document.getElementById('input-box');
            inp.placeholder = `Mula dalam ${count}...`;
            
            // Set perkataan siri teks balapan
            renderWords();

            const timer = setInterval(() => {
                count--;
                if(count <= 0) {
                    clearInterval(timer);
                    isGameActive = true;
                    document.getElementById('live-timer-banner').style.display = 'block';
                    if(!amISpectator) {
                        inp.disabled = false;
                        inp.placeholder = "TAIP SEKARANG!";
                        inp.focus();
                    } else {
                        inp.placeholder = "Balapan sedang berjalan... (Menonton)";
                    }
                } else {
                    inp.placeholder = `Mula dalam ${count}...`;
                }
            }, 1000);
        });

        function renderWords() {
            const wrapper = document.getElementById('words-wrapper');
            wrapper.innerHTML = '';
            wordsList.forEach((w, idx) => {
                const span = document.createElement('span');
                span.className = "word" + (idx === 0 ? " current" : "");
                span.id = `word-${idx}`;
                span.innerText = w;
                wrapper.appendChild(span);
            });
            currentWordIndex = 0;
        }

        function handleTypingInput() {
            if(!isGameActive || amISpectator) return;
            const inp = document.getElementById('input-box');
            const txt = inp.value;
            const target = wordsList[currentWordIndex];
            const span = document.getElementById(`word-${currentWordIndex}`);

            if(txt.endsWith(' ')) {
                if(txt.trim() === target) {
                    span.className = "word completed";
                    currentWordIndex++;
                    inp.value = '';
                    
                    let progress = Math.floor((currentWordIndex / wordsList.length) * 100);
                    let dummyWpm = Math.floor((currentWordIndex * 60) / 5) || 30; // Simulasi WPM ringkas
                    
                    socket.emit('updateProgress', { roomId: currentOnlineRoomId, progressPercent: progress, currentWpm: dummyWpm, emoji: mySelectedEmoji });

                    if(currentWordIndex >= wordsList.length) {
                        isGameActive = false;
                        inp.disabled = true;
                        inp.placeholder = "FINISH! Menunggu keputusan...";
                        socket.emit('playerFinished', { roomId: currentOnlineRoomId, name: myName, wpm: dummyWpm, isPlayer: true, emoji: mySelectedEmoji });
                    } else {
                        document.getElementById(`word-${currentWordIndex}`).className = "word current";
                    }
                } else {
                    span.className = "word current error";
                }
            } else {
                if(target.startsWith(txt)) {
                    span.className = "word current";
                } else {
                    span.className = "word current error";
                }
            }
        }

        socket.on('receiveFinalData', (results) => {
            openScoresModal();
            document.getElementById('view-scores-btn').style.display = 'inline-block';
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = '';
            results.forEach((r, idx) => {
                list.innerHTML += `<div style="padding: 8px; border-bottom: 1px solid #334155;">#${idx+1} ${r.emoji || '🚗'} <strong>${r.name}</strong> - ${r.wpm} WPM</div>`;
            });
        });

        function requestResetMatch() {
            socket.emit('requestReset', { roomId: currentOnlineRoomId });
        }

        socket.on('performReset', () => {
            isGameActive = false;
            amIReady = false;
            const inp = document.getElementById('input-box');
            inp.value = "";
            inp.className = "";
            inp.placeholder = amISpectator ? "Mode Menonton Aktif 👁️" : "Menunggu Balapan...";
            document.getElementById('words-wrapper').style.transform = "translateY(0px)";
            document.getElementById('live-timer-banner').style.display = 'none';
            document.getElementById('view-scores-btn').style.display = 'none';
            document.getElementById('ready-btn').innerText = "READY 🏁";
            closeModalOnly();
        });

        // FUNGSI LINK DAN MODAL ASAL ANDA
        function copyRoomShareLink() {
            const dummy = document.createElement('input'); 
            dummy.value = window.location.origin + "?room=" + currentOnlineRoomId;
            document.body.appendChild(dummy); 
            dummy.select(); 
            document.execCommand('copy'); 
            document.body.removeChild(dummy);
            alert("Link Kamar Mabar berhasil disalin!");
        }
        
        function leaveRoomAction() { window.location.reload(); }
        function openScoresModal() { document.getElementById('results-modal').classList.add('active'); }
        function closeModalOnly() { document.getElementById('results-modal').classList.remove('active'); }

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search); 
            const rParam = urlParams.get('room');
            if(rParam) {
                urlRoomCode = rParam.toUpperCase();
                document.getElementById('lobby-panel').style.display = 'none';
                document.getElementById('sharelink-join-modal').classList.add('active');
            }
        }
    </script>
</body>
</html>
